<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>image-shrinker — compress images in your browser</title>
<meta name="description" content="Compress and resize images entirely in your browser. Nothing is uploaded to any server.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0c10">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9V5a1 1 0 0 1 1-1h4M20 15v4a1 1 0 0 1-1 1h-4"/>
      <path d="M9 9 4 4M15 15l5 5"/>
    </svg>
    <span>client-side</span>
  </div>
  <h1>image-shrinker</h1>
  <p class="tagline">Compress images in your browser. Nothing leaves your device.</p>
</header>

<main>
  <section id="dropzone" class="dropzone" tabindex="0" role="button"
           aria-label="Drop images here, or press Enter to browse files">
    <input id="fileInput" type="file" accept="image/*" multiple hidden>

    <svg class="dropzone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/>
      <path d="M3 15v3a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3v-3"/>
    </svg>

    <p class="dropzone__title">Drop images here</p>
    <p class="dropzone__sub">or <button id="browseBtn" class="link" type="button">browse files</button></p>
    <p class="dropzone__hint">JPEG · PNG · WebP · GIF (first frame)</p>
  </section>

  <section class="panel" aria-label="Compression settings">
    <div class="field">
      <span class="field__label">Max edge</span>
      <div class="segmented" id="maxEdgeGroup" role="radiogroup" aria-label="Maximum edge length">
        <button class="seg" type="button" role="radio" data-value="2560" aria-checked="false">2560</button>
        <button class="seg is-on" type="button" role="radio" data-value="1920" aria-checked="true">1920</button>
        <button class="seg" type="button" role="radio" data-value="1280" aria-checked="false">1280</button>
        <button class="seg" type="button" role="radio" data-value="800" aria-checked="false">800</button>
        <button class="seg" type="button" role="radio" data-value="0" aria-checked="false">original</button>
      </div>
    </div>

    <div class="field">
      <span class="field__label">Format</span>
      <div class="segmented" id="formatGroup" role="radiogroup" aria-label="Output format">
        <button class="seg is-on" type="button" role="radio" data-value="image/jpeg" aria-checked="true">JPEG</button>
        <button class="seg" type="button" role="radio" data-value="image/webp" aria-checked="false">WebP</button>
      </div>
    </div>

    <div class="field field--quality">
      <label class="field__label" for="quality">
        <span>Quality</span>
        <output id="qualityOut" for="quality">82%</output>
      </label>
      <input id="quality" type="range" min="40" max="95" value="82">
    </div>
  </section>

  <div class="summary" id="summary" hidden>
    <div class="summary__stats" id="summaryStats"></div>
    <div class="summary__actions">
      <button class="btn btn--ghost" id="clearBtn" type="button">Clear</button>
      <button class="btn btn--primary" id="downloadAll" type="button">Download all</button>
    </div>
  </div>

  <ul class="results" id="results" hidden></ul>
</main>

<footer class="footer">
  <span>Canvas API · no server · no tracking · no uploads</span>
  <a href="https://github.com/ALGSN1386/image-shrinker">Source on GitHub</a>
</footer>

<script src="app.js"></script>
</body>
</html>
